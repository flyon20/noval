server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: novel-analyzer-backend
  servlet:
    multipart:
      max-file-size: ${PROJECT_DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${PROJECT_DOCUMENT_MAX_REQUEST_SIZE:100MB}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:noval}
    password: ${RABBITMQ_PASSWORD:CHANGE_ME_WITH_A_STRONG_RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        concurrency: ${NOVAL_RESOURCE_MAX_INDEX_CONCURRENCY:${KNOWLEDGE_INDEX_WORKER_CONCURRENCY:1}}
        max-concurrency: ${NOVAL_RESOURCE_MAX_INDEX_CONCURRENCY:${KNOWLEDGE_INDEX_WORKER_CONCURRENCY:1}}
        prefetch: ${NOVAL_RESOURCE_MAX_INDEX_CONCURRENCY:${KNOWLEDGE_INDEX_WORKER_CONCURRENCY:1}}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:novel_analyzer}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=${MYSQL_CONNECT_TIMEOUT_MS:10000}&socketTimeout=${MYSQL_SOCKET_TIMEOUT_MS:300000}&tcpKeepAlive=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:120000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:60000}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:15s}

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO

app:
  cloudflare:
    turnstile:
      enabled: ${CLOUDFLARE_TURNSTILE_ENABLED:false}
      site-key: ${CLOUDFLARE_TURNSTILE_SITE_KEY:}
      secret-key: ${CLOUDFLARE_TURNSTILE_SECRET_KEY:}
      verify-url: ${CLOUDFLARE_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
      expected-hostname: ${CLOUDFLARE_TURNSTILE_EXPECT_HOSTNAME:}
  auth:
    demo-enabled: ${APP_DEMO_ENABLED:false}
    demo-username: ${APP_DEMO_USERNAME:}
    demo-password: ${APP_DEMO_PASSWORD:}
    jwt-secret: ${JWT_SECRET:}
    access-token-expire-seconds: ${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:900}
    refresh-token-expire-seconds: ${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:604800}
    session-max-devices: ${AUTH_SESSION_MAX_DEVICES:3}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    refresh-cookie-path: ${AUTH_REFRESH_COOKIE_PATH:/api/auth}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
  sms-auth:
    enabled: ${ALIYUN_DYPNS_ENABLED:false}
    access-key-id: ${ALIYUN_DYPNS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_DYPNS_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_DYPNS_ENDPOINT:dypnsapi.aliyuncs.com}
    country-code: ${ALIYUN_DYPNS_COUNTRY_CODE:86}
    scheme-name: ${ALIYUN_DYPNS_SCHEME_NAME:noval-web}
    sign-name: ${ALIYUN_DYPNS_SIGN_NAME:}
    template-code-register: ${ALIYUN_DYPNS_TEMPLATE_CODE_REGISTER:}
    template-code-login: ${ALIYUN_DYPNS_TEMPLATE_CODE_LOGIN:}
    template-code-reset-password: ${ALIYUN_DYPNS_TEMPLATE_CODE_RESET_PASSWORD:}
    valid-time-minutes: ${ALIYUN_DYPNS_VALID_TIME_MINUTES:5}
    interval-seconds: ${ALIYUN_DYPNS_INTERVAL_SECONDS:60}
    phone-window-seconds: ${SMS_RISK_PHONE_WINDOW_SECONDS:600}
    phone-max-attempts: ${SMS_RISK_PHONE_MAX_ATTEMPTS:3}
    ip-window-seconds: ${SMS_RISK_IP_WINDOW_SECONDS:600}
    ip-max-attempts: ${SMS_RISK_IP_MAX_ATTEMPTS:5}
    biz-window-seconds: ${SMS_RISK_BIZ_WINDOW_SECONDS:1800}
    biz-max-attempts: ${SMS_RISK_BIZ_MAX_ATTEMPTS:3}
  security:
    rate-limit-per-minute: ${SECURITY_RATE_LIMIT_PER_MINUTE:100}
    auto-blacklist-threshold: ${SECURITY_AUTO_BLACKLIST_THRESHOLD:20}
    blacklist-seconds: ${SECURITY_BLACKLIST_SECONDS:86400}
    password-login-phone-window-seconds: ${SECURITY_PASSWORD_LOGIN_PHONE_WINDOW_SECONDS:600}
    password-login-phone-max-failures: ${SECURITY_PASSWORD_LOGIN_PHONE_MAX_FAILURES:6}
    password-login-ip-window-seconds: ${SECURITY_PASSWORD_LOGIN_IP_WINDOW_SECONDS:600}
    password-login-ip-max-failures: ${SECURITY_PASSWORD_LOGIN_IP_MAX_FAILURES:20}
    password-login-phone-ip-window-seconds: ${SECURITY_PASSWORD_LOGIN_PHONE_IP_WINDOW_SECONDS:600}
    password-login-phone-ip-max-failures: ${SECURITY_PASSWORD_LOGIN_PHONE_IP_MAX_FAILURES:4}
    password-login-cooldown-seconds: ${SECURITY_PASSWORD_LOGIN_COOLDOWN_SECONDS:900}
    trusted-proxy-ips: ${SECURITY_TRUSTED_PROXY_IPS:}
    protected-path-prefixes:
      - /api/auth
      - /api/secure
      - /api/system
      - /api/crawler
      - /api/analysis
      - /api/knowledge
      - /api/config
      - /api/data
    whitelist-paths:
      - /api/system/health
      - /api/system/auth-public-config
      - /api/auth/login
      - /api/auth/login/password
      - /api/auth/login/sms
      - /api/auth/register
      - /api/auth/sms/send
      - /api/auth/password/reset
      - /api/auth/refresh
      - /api/auth/logout
  crawler:
    base-url: ${CRAWLER_BASE_URL:http://127.0.0.1:5000}
    internal-api-key: ${CRAWLER_INTERNAL_API_KEY:}
    connect-timeout-millis: ${CRAWLER_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${CRAWLER_READ_TIMEOUT_MILLIS:180000}
    rank-backfill:
      enabled: ${CRAWLER_RANK_BACKFILL_ENABLED:true}
      cron: "${CRAWLER_RANK_BACKFILL_CRON:0 15 2 * * ?}"
      platform: ${CRAWLER_RANK_BACKFILL_PLATFORM:fanqie}
      refresh-days: ${CRAWLER_RANK_BACKFILL_REFRESH_DAYS:3}
      batch-size: ${CRAWLER_RANK_BACKFILL_BATCH_SIZE:20}
      rank-fetch-count: ${CRAWLER_RANK_BACKFILL_FETCH_COUNT:50}
    rank-catalog-sync:
      enabled: ${CRAWLER_RANK_CATALOG_SYNC_ENABLED:true}
      cron: "${CRAWLER_RANK_CATALOG_SYNC_CRON:0 35 2 1 * ?}"
      platform: ${CRAWLER_RANK_CATALOG_SYNC_PLATFORM:fanqie}
  knowledge:
    resource-policy:
      max-active-deep-runs: ${NOVAL_RESOURCE_MAX_ACTIVE_DEEP_RUNS:1}
      max-active-fast-runs: ${NOVAL_RESOURCE_MAX_ACTIVE_FAST_RUNS:2}
      max-active-llm-calls: ${NOVAL_RESOURCE_MAX_ACTIVE_LLM_CALLS:2}
      max-delegated-agent-concurrency: ${NOVAL_RESOURCE_MAX_DELEGATED_AGENT_CONCURRENCY:1}
      max-index-concurrency: ${NOVAL_RESOURCE_MAX_INDEX_CONCURRENCY:1}
      max-crawler-concurrency: ${NOVAL_RESOURCE_MAX_CRAWLER_CONCURRENCY:2}
      memory-pause-percent: ${NOVAL_RESOURCE_MEMORY_PAUSE_PERCENT:85}
      memory-reject-deep-percent: ${NOVAL_RESOURCE_MEMORY_REJECT_DEEP_PERCENT:92}
      disk-warn-percent: ${NOVAL_RESOURCE_DISK_WARN_PERCENT:80}
      disk-stop-import-percent: ${NOVAL_RESOURCE_DISK_STOP_IMPORT_PERCENT:90}
      queue-backlog-warn-count: ${NOVAL_RESOURCE_QUEUE_BACKLOG_WARN_COUNT:20}
      queue-oldest-warn-minutes: ${NOVAL_RESOURCE_QUEUE_OLDEST_WARN_MINUTES:5}
    qdrant:
      base-url: ${KNOWLEDGE_QDRANT_BASE_URL:http://127.0.0.1:6333}
      collection: ${KNOWLEDGE_QDRANT_COLLECTION:novel_knowledge_chunks}
      memory-collection: ${KNOWLEDGE_QDRANT_MEMORY_COLLECTION:noval_ai_memory}
    embedding:
      provider: ${KNOWLEDGE_EMBEDDING_PROVIDER:dashscope}
      base-url: ${KNOWLEDGE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model: ${KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${KNOWLEDGE_EMBEDDING_DIMENSION:1024}
      api-key-ref: ${KNOWLEDGE_EMBEDDING_API_KEY_REF:DASHSCOPE_API_KEY}
      api-key: ${KNOWLEDGE_EMBEDDING_API_KEY:}
    index:
      max-chapters: ${KNOWLEDGE_INDEX_MAX_CHAPTERS:10}
      max-active-jobs: ${KNOWLEDGE_INDEX_MAX_ACTIVE_JOBS:1}
      chunk-target-chars: ${KNOWLEDGE_INDEX_CHUNK_TARGET_CHARS:1000}
      chunk-overlap-chars: ${KNOWLEDGE_INDEX_CHUNK_OVERLAP_CHARS:160}
      queue-enabled: ${KNOWLEDGE_INDEX_QUEUE_ENABLED:true}
      worker-concurrency: ${NOVAL_RESOURCE_MAX_INDEX_CONCURRENCY:${KNOWLEDGE_INDEX_WORKER_CONCURRENCY:1}}
      max-retries: ${KNOWLEDGE_INDEX_MAX_RETRIES:3}
      visibility-timeout-seconds: ${KNOWLEDGE_INDEX_VISIBILITY_TIMEOUT_SECONDS:600}
      retry-backoff-seconds: "${KNOWLEDGE_INDEX_RETRY_BACKOFF_SECONDS:30,120,600}"
      rabbit:
        exchange: ${KNOWLEDGE_INDEX_RABBIT_EXCHANGE:noval.knowledge.index}
        queue: ${KNOWLEDGE_INDEX_RABBIT_QUEUE:noval.knowledge.index.book}
        routing-key: ${KNOWLEDGE_INDEX_RABBIT_ROUTING_KEY:knowledge.index.book}
        retry-exchange: ${KNOWLEDGE_INDEX_RABBIT_RETRY_EXCHANGE:noval.knowledge.index.retry}
        retry-routing-key-prefix: ${KNOWLEDGE_INDEX_RABBIT_RETRY_ROUTING_KEY_PREFIX:knowledge.index.book.retry}
        dead-letter-exchange: ${KNOWLEDGE_INDEX_RABBIT_DEAD_LETTER_EXCHANGE:noval.knowledge.index.dlx}
        dead-letter-queue: ${KNOWLEDGE_INDEX_RABBIT_DEAD_LETTER_QUEUE:noval.knowledge.index.book.dlq}
        dead-letter-routing-key: ${KNOWLEDGE_INDEX_RABBIT_DEAD_LETTER_ROUTING_KEY:knowledge.index.book.dlq}
      rank-incremental-enabled: ${KNOWLEDGE_RANK_INCREMENTAL_ENABLED:true}
      rank-incremental-cron: "${KNOWLEDGE_RANK_INCREMENTAL_CRON:0 20 3 * * ?}"
      rank-incremental-limit: ${KNOWLEDGE_RANK_INCREMENTAL_LIMIT:500}
      chapter-missing-enabled: ${KNOWLEDGE_CHAPTER_MISSING_ENABLED:false}
      chapter-missing-cron: "${KNOWLEDGE_CHAPTER_MISSING_CRON:0 50 3 * * ?}"
      chapter-missing-limit: ${KNOWLEDGE_CHAPTER_MISSING_LIMIT:100}
    chat-run:
      queue-enabled: ${KNOWLEDGE_CHAT_RUN_QUEUE_ENABLED:false}
      worker-concurrency: ${KNOWLEDGE_CHAT_RUN_WORKER_CONCURRENCY:1}
      lease-seconds: ${KNOWLEDGE_CHAT_RUN_LEASE_SECONDS:45}
      heartbeat-seconds: ${KNOWLEDGE_CHAT_RUN_HEARTBEAT_SECONDS:10}
      outbox-dispatch-interval-millis: ${KNOWLEDGE_CHAT_RUN_OUTBOX_DISPATCH_INTERVAL_MILLIS:1000}
      outbox-recovery-interval-millis: ${KNOWLEDGE_CHAT_RUN_OUTBOX_RECOVERY_INTERVAL_MILLIS:30000}
      outbox-recovery-initial-delay-millis: ${KNOWLEDGE_CHAT_RUN_OUTBOX_RECOVERY_INITIAL_DELAY_MILLIS:30000}
      rabbit:
        exchange: ${KNOWLEDGE_CHAT_RUN_RABBIT_EXCHANGE:noval.knowledge.chat.run}
        queue: ${KNOWLEDGE_CHAT_RUN_RABBIT_QUEUE:noval.knowledge.chat.run}
        routing-key: ${KNOWLEDGE_CHAT_RUN_RABBIT_ROUTING_KEY:knowledge.chat.run}
        dead-letter-exchange: ${KNOWLEDGE_CHAT_RUN_RABBIT_DEAD_LETTER_EXCHANGE:noval.knowledge.chat.run.dlx}
        dead-letter-queue: ${KNOWLEDGE_CHAT_RUN_RABBIT_DEAD_LETTER_QUEUE:noval.knowledge.chat.run.dlq}
        dead-letter-routing-key: ${KNOWLEDGE_CHAT_RUN_RABBIT_DEAD_LETTER_ROUTING_KEY:knowledge.chat.run.dlq}

    project-ingest:
      queue-enabled: ${KNOWLEDGE_PROJECT_INGEST_QUEUE_ENABLED:true}
      worker-concurrency: ${KNOWLEDGE_PROJECT_INGEST_WORKER_CONCURRENCY:1}
      lease-seconds: ${KNOWLEDGE_PROJECT_INGEST_LEASE_SECONDS:60}
      heartbeat-seconds: ${KNOWLEDGE_PROJECT_INGEST_HEARTBEAT_SECONDS:15}
      max-attempts: ${KNOWLEDGE_PROJECT_INGEST_MAX_ATTEMPTS:4}
      max-chapter-chars: ${KNOWLEDGE_PROJECT_INGEST_MAX_CHAPTER_CHARS:100000}
      max-file-bytes: ${KNOWLEDGE_PROJECT_INGEST_MAX_FILE_BYTES:20971520}
      max-chapters-per-project: ${KNOWLEDGE_PROJECT_INGEST_MAX_CHAPTERS_PER_PROJECT:5000}
      max-concurrent-jobs-per-user: ${KNOWLEDGE_PROJECT_INGEST_MAX_CONCURRENT_JOBS_PER_USER:1}
      parser-version: ${KNOWLEDGE_PROJECT_INGEST_PARSER_VERSION:project-ingest-v1}
      retry-backoff-seconds: ${KNOWLEDGE_PROJECT_INGEST_RETRY_BACKOFF_SECONDS:30,120,600}
      rabbit:
        exchange: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_EXCHANGE:noval.knowledge.project-ingest}
        queue: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_QUEUE:noval.knowledge.project-ingest.job}
        routing-key: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_ROUTING_KEY:knowledge.project-ingest.job}
        dead-letter-exchange: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_DEAD_LETTER_EXCHANGE:noval.knowledge.project-ingest.dlx}
        dead-letter-queue: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_DEAD_LETTER_QUEUE:noval.knowledge.project-ingest.job.dlq}
        dead-letter-routing-key: ${KNOWLEDGE_PROJECT_INGEST_RABBIT_DEAD_LETTER_ROUTING_KEY:knowledge.project-ingest.job.dlq}
    document-batch:
      queue-enabled: ${KNOWLEDGE_DOCUMENT_BATCH_QUEUE_ENABLED:true}
      worker-concurrency: ${KNOWLEDGE_DOCUMENT_BATCH_WORKER_CONCURRENCY:1}
      lease-seconds: ${KNOWLEDGE_DOCUMENT_BATCH_LEASE_SECONDS:300}
      max-attempts: ${KNOWLEDGE_DOCUMENT_BATCH_MAX_ATTEMPTS:4}
      max-files: ${KNOWLEDGE_DOCUMENT_BATCH_MAX_FILES:200}
      max-batch-bytes: ${KNOWLEDGE_DOCUMENT_BATCH_MAX_BYTES:94371840}
      max-zip-entries: ${KNOWLEDGE_DOCUMENT_BATCH_MAX_ZIP_ENTRIES:1000}
      max-expanded-bytes: ${KNOWLEDGE_DOCUMENT_BATCH_MAX_EXPANDED_BYTES:209715200}
      document-index-batch-size: ${KNOWLEDGE_DOCUMENT_INDEX_BATCH_SIZE:32}
      chapter-dispatch-window: ${KNOWLEDGE_DOCUMENT_CHAPTER_DISPATCH_WINDOW:8}
      rabbit:
        exchange: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_EXCHANGE:noval.knowledge.document-batch}
        queue: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_QUEUE:noval.knowledge.document-batch.parse}
        routing-key: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_ROUTING_KEY:knowledge.document-batch.parse}
        dead-letter-exchange: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_DEAD_LETTER_EXCHANGE:noval.knowledge.document-batch.dlx}
        dead-letter-queue: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_DEAD_LETTER_QUEUE:noval.knowledge.document-batch.parse.dlq}
        dead-letter-routing-key: ${KNOWLEDGE_DOCUMENT_BATCH_RABBIT_DEAD_LETTER_ROUTING_KEY:knowledge.document-batch.parse.dlq}
  ai:
    cache-continuity-enabled: ${AI_CACHE_CONTINUITY_ENABLED:true}
    provider-type: ${AI_PROVIDER_TYPE:openai-compatible}
    dify-base-url: ${DIFY_BASE_URL:https://api.dify.ai/v1}
    dify-api-key-ref: ${DIFY_API_KEY_REF:}
    fallback-model: ${AI_FALLBACK_MODEL:local-fallback}
    timeout-millis: ${AI_TIMEOUT_MILLIS:15000}
    mcp-backend-attestation-key: ${MCP_BACKEND_ATTESTATION_KEY:}
    mcp-backend-attestation-max-age-seconds: ${MCP_BACKEND_ATTESTATION_MAX_AGE_SECONDS:60}
    langgraph-worker:
      base-url: ${AI_LANGGRAPH_WORKER_BASE_URL:http://127.0.0.1:8001}
      internal-api-key: ${AI_LANGGRAPH_WORKER_INTERNAL_API_KEY:}
      timeout-millis: ${AI_LANGGRAPH_WORKER_TIMEOUT_MILLIS:30000}
    openai-compatible:
      base-url: ${AI_OPENAI_COMPATIBLE_BASE_URL:https://api.deepseek.com/v1}
      api-key-ref: ${AI_OPENAI_COMPATIBLE_API_KEY_REF:DEEPSEEK_API_KEY}
      default-model: ${AI_OPENAI_COMPATIBLE_DEFAULT_MODEL:deepseek-chat}
      streaming-enabled: ${AI_OPENAI_COMPATIBLE_STREAMING_ENABLED:true}
